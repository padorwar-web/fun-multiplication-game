<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Times Tables Hero!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            background: #bae6fd; /* Light sky blue */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: x-hidden;
        }

        /* Animated Clouds Background Elements */
        .cloud {
            background: white;
            background: linear-gradient(top, white 5%, #f1f1f1 100%);
            border-radius: 100px;
            box-shadow: 0 8px 5px rgba(0, 0, 0, 0.05);
            position: absolute;
            z-index: 0;
            opacity: 0.85;
        }
        .cloud:after, .cloud:before {
            background: white;
            content: '';
            position: absolute;
            z-index: -1;
        }
        .cloud:after {
            border-radius: 100px;
            height: 100px;
            left: 50px;
            top: -50px;
            width: 100px;
        }
        .cloud:before {
            border-radius: 200px;
            width: 180px;
            height: 180px;
            right: 50px;
            top: -90px;
        }
        .c1 { width: 350px; height: 120px; top: 10%; left: -5%; animation: floatAround 35s infinite linear; }
        .c2 { width: 200px; height: 70px; top: 45%; right: -10%; animation: floatAround 25s infinite linear reverse; }
        .c3 { width: 280px; height: 90px; bottom: 15%; left: 10%; animation: floatAround 40s infinite linear; }

        @keyframes floatAround {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(110vw); }
        }

        /* Main Game Panel Setup */
        .game-container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 32px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 8px solid #ffde4d;
            position: relative;
            z-index: 10;
        }
        h1 { color: #ff3b70; margin-top: 0; font-size: 2.3rem; text-shadow: 2px 2px #fff699; letter-spacing: 1px; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #f0f7ff;
            padding: 14px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #1e293b;
            border: 3px solid #e2e8f0;
        }
        .timer-bar-container {
            background: #f1f5f9;
            height: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 3px solid #e2e8f0;
        }
        .timer-bar {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 100%;
            transition: width 1s linear;
        }
        .flashcard {
            background: #fffdf5;
            border: 5px dashed #ffa043;
            border-radius: 20px;
            padding: 30px;
            font-size: 3.8rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 25px;
        }
        .input-area {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            width: 130px;
            padding: 12px;
            font-size: 2rem;
            text-align: center;
            border: 4px solid #cbd5e1;
            border-radius: 16px;
            outline: none;
            font-family: inherit;
            color: #1e293b;
        }
        input:focus { border-color: #3b82f6; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1d4ed8;
            transition: all 0.1s;
            font-family: inherit;
        }
        button:active { transform: translateY(5px); box-shadow: none; }
        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 45px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .correct-pop { color: #166534; background: #dcfce7; border: 3px solid #bbf7d0; animation: bounce 0.5s ease; }
        .wrong-pop { color: #991b1b; background: #fee2e2; border: 3px solid #fecaca; }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <!-- Cloud Background Decorations -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <!-- Active Game Unit -->
    <div class="game-container">
        <h1>Maths Hero! 🚀</h1>
        <div class="stats-grid">
            <div class="stat-box">⭐ Score: <span id="score">0</span></div>
            <div class="stat-box">⏳ Time: <span id="time-text">30</span>s</div>
        </div>
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div id="flashcard" class="flashcard">? × ?</div>
        <div class="input-area">
            <input type="number" id="answer-input" placeholder="?" min="0" autocomplete="off">
            <button id="check-btn" onclick="checkAnswer()">Check!</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        let score = 0, num1 = 0, num2 = 0, correctAnswer = 0, attempts = 0, timeLeft = 30, timerInterval;
        const input = document.getElementById('answer-input');

        function generateQuestion() {
            num1 = Math.floor(Math.random() * 12) + 1;
            num2 = Math.floor(Math.random() * 12) + 1;
            correctAnswer = num1 * num2;
            attempts = 0;
            timeLeft = 30;
            document.getElementById('flashcard').innerText = `${num1} × ${num2}`;
            input.value = '';
            input.disabled = false;
            document.getElementById('check-btn').disabled = false;
            document.getElementById('feedback').className = "feedback";
            document.getElementById('feedback').innerHTML = "";
            input.focus();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-text').innerText = timeLeft;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 30) * 100;
            const bar = document.getElementById('timer-bar');
            bar.style.width = percentage + '%';
            bar.style.background = percentage > 50 ? '#4ade80' : percentage > 20 ? '#facc15' : '#f87171';
        }

        function checkAnswer() {
            let userAnswer = parseInt(input.value);
            let feedback = document.getElementById('feedback');
            if (isNaN(userAnswer)) return;

            if (userAnswer === correctAnswer) {
                clearInterval(timerInterval);
                let points = timeLeft > 15 ? 20 : 10;
                score += points;
                document.getElementById('score').innerText = score;
                feedback.className = "feedback correct-pop";
                feedback.innerHTML = `🎉 Correct! +${points} Points! 🌟`;
                input.disabled = true;
                setTimeout(generateQuestion, 2000);
            } else {
                attempts++;
                if (attempts < 3) {
                    feedback.className = "feedback wrong-pop";
                    feedback.innerHTML = `❌ Try again! (Attempt ${attempts}/3) 🤔`;
                    input.value = '';
                    input.focus();
                } else {
                    clearInterval(timerInterval);
                    feedback.className = "feedback wrong-pop";
                    feedback.innerHTML = `💡 Out of tries! ${num1} × ${num2} = ${correctAnswer}`;
                    input.disabled = true;
                    setTimeout(generateQuestion, 3500);
                }
            }
        }

        function handleTimeout() {
            let feedback = document.getElementById('feedback');
            feedback.className = "feedback wrong-pop";
            feedback.innerHTML = `⏰ Time's up! ${num1} × ${num2} = ${correctAnswer}`;
            input.disabled = true;
            setTimeout(generateQuestion, 3500);
        }

        input.addEventListener("keyup", function(event) {
            if (event.key === "Enter") checkAnswer();
        });

        generateQuestion();
    </script>
</body>
</html>


with open("index.html", "w", encoding="utf-8") as f:
    f.write(game_code)
