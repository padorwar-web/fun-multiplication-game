<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Times Tables Hero!</title>
    <style>
        /* Reset and Layout Foundations */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            background-color: #3b82f6; /* Solid, clean plain blue background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Perfectly Centred Game Panel Housing */
        .game-wrapper {
            background: #ffffff;
            border: 8px solid #ffde4d;
            border-radius: 32px;
            padding: 30px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            color: #ff3b70;
            font-size: 2.2rem;
            margin-bottom: 16px;
            text-shadow: 2px 2px #fff699;
            letter-spacing: 0.5px;
        }

        /* Score Boards Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .data-panel {
            background: #f0f7ff;
            border: 3px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e293b;
        }

        .streak-panel {
            grid-column: span 2;
            background: #fef3c7;
            border-color: #fde68a;
            color: #92400e;
        }

        /* 30-Second Countdown Visual Timer Track */
        .timer-track {
            background: #f1f5f9;
            height: 20px;
            border-radius: 10px;
            border: 3px solid #e2e8f0;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            width: 100%;
            height: 100%;
            transition: width 1s linear, background-color 0.3s;
        }

        /* Times Tables Problem Flashcard */
        .math-flashcard {
            background: #fffdf5;
            border: 5px dashed #ffa043;
            border-radius: 20px;
            padding: 24px;
            font-size: 3.6rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 20px;
            user-select: none;
        }

        /* User Typing Interaction Bar */
        .submission-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .num-input {
            width: 125px;
            padding: 10px;
            font-size: 2rem;
            text-align: center;
            border: 4px solid #cbd5e1;
            border-radius: 16px;
            outline: none;
            color: #1e293b;
            font-family: inherit;
        }

        .num-input:focus {
            border-color: #3b82f6;
        }

        .action-button {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 0 24px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1d4ed8;
            transition: transform 0.05s, box-shadow 0.05s;
            font-family: inherit;
        }

        .action-button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .action-button:disabled {
            background: #94a3b8;
            box-shadow: 0 5px 0 #64748b;
            cursor: not-allowed;
        }

        /* Colourful Responsive Visual Messages */
        .alert-box {
            font-size: 1.15rem;
            font-weight: bold;
            min-height: 52px;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .state-empty {
            background: transparent;
            border: none;
        }

        .state-correct {
            color: #166534;
            background: #dcfce7;
            border: 3px solid #bbf7d0;
            animation: starPop 0.4s ease-out;
        }

        .state-incorrect {
            color: #991b1b;
            background: #fee2e2;
            border: 3px solid #fecaca;
        }

        @keyframes starPop {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        /* Mobile Viewport Scale Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .math-flashcard {
                font-size: 3rem;
                padding: 18px;
            }
            .num-input {
                width: 105px;
                font-size: 1.7rem;
            }
            .action-button {
                font-size: 1.15rem;
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Maths Hero! 🚀</h1>
        
        <div class="dashboard-grid">
            <div class="data-panel">⭐ Score: <span id="display-score">0</span></div>
            <div class="data-panel">⏳ Time: <span id="display-timer">30</span>s</div>
            <div class="data-panel streak-panel">🔥 Current Streak: <span id="display-streak">0</span> | 🏆 Best: <span id="display-best">0</span></div>
        </div>

        <div class="timer-track">
            <div id="visual-timer" class="timer-fill"></div>
        </div>

        <div id="display-question" class="math-flashcard">Loading...</div>

        <div class="submission-bar">
            <input type="number" id="user-entry" placeholder="?" min="0" autocomplete="off" inputmode="numeric" class="num-input">
            <button id="submit-trigger" class="action-button">Check!</button>
        </div>

        <div id="display-alert" class="alert-box state-empty"></div>
    </div>
    <script>
        (function() {
            let activeScore = 0;
            let runningStreak = 0;
            let recordStreak = 0;
            
            let factorA = 0;
            let factorB = 0;
            let targetProduct = 0;
            let badAttempts = 0;
            let countdownSeconds = 30;
            let clockTicker = null;

            const inputField = document.getElementById('user-entry');
            const commitButton = document.getElementById('submit-trigger');
            const cardDisplay = document.getElementById('display-question');
            const alertDisplay = document.getElementById('display-alert');
            const barFill = document.getElementById('visual-timer');

            function startNewRound() {
                clearInterval(clockTicker);

                // Range covers 1x1 up to 12x12 tables
                factorA = Math.floor(Math.random() * 12) + 1;
                factorB = Math.floor(Math.random() * 12) + 1;
                targetProduct = factorA * factorB;
                
                badAttempts = 0;
                countdownSeconds = 30;

                cardDisplay.innerText = factorA + " × " + factorB;
                document.getElementById('display-timer').innerText = countdownSeconds;
                
                alertDisplay.className = "alert-box state-empty";
                alertDisplay.innerHTML = "";
                
                inputField.value = "";
                inputField.disabled = false;
                commitButton.disabled = false;
                
                updateTimerVisuals();
                inputField.focus();

                clockTicker = setInterval(runClockStep, 1000);
            }

            function runClockStep() {
                countdownSeconds--;
                document.getElementById('display-timer').innerText = countdownSeconds;
                updateTimerVisuals();

                if (countdownSeconds <= 0) {
                    clearInterval(clockTicker);
                    handleFailureState("⏰ Time's up!");
                }
            }

            function updateTimerVisuals() {
                const ratio = (countdownSeconds / 30) * 100;
                barFill.style.width = ratio + "%";
                
                if (ratio > 50) {
                    // Safe Green
                    barFill.style.background = "linear-gradient(90deg, #4ade80, #22c55e)"; 
                } else if (ratio > 20) {
                    // Warning Yellow
                    barFill.style.background = "linear-gradient(90deg, #facc15, #eab308)"; 
                } else {
                    // Critical Red
                    barFill.style.background = "linear-gradient(90deg, #f87171, #ef4444)"; 
                }
            }

            function processUserValidation() {
                const parsedValue = parseInt(inputField.value, 10);
                if (isNaN(parsedValue)) return;

                inputField.disabled = true;
                commitButton.disabled = true;

                if (parsedValue === targetProduct) {
                    clearInterval(clockTicker);
                    
                    // Higher rewards for speedier responses
                    let gainedPoints = 10;
                    if (countdownSeconds >= 20) {
                        gainedPoints = 25; 
                    } else if (countdownSeconds >= 10) {
                        gainedPoints = 18; 
                    }

                    activeScore += gainedPoints;
                    runningStreak++;
                    if (runningStreak > recordStreak) {
                        recordStreak = runningStreak;
                    }

                    document.getElementById('display-score').innerText = activeScore;
                    document.getElementById('display-streak').innerText = runningStreak;
                    document.getElementById('display-best').innerText = recordStreak;

                    alertDisplay.className = "alert-box state-correct";
                    alertDisplay.innerHTML = "🎉 Excellent! +" + gainedPoints + " Points! ✨";

                    setTimeout(startNewRound, 2000);

                } else {
                    badAttempts++;
                    
                    if (badAttempts < 3) {
                        alertDisplay.className = "alert-box state-incorrect";
                        alertDisplay.innerHTML = "❌ Not quite! Try again (Try " + badAttempts + "/3) 🤔";
                        
                        inputField.disabled = false;
                        commitButton.disabled = false;
                        inputField.value = "";
                        inputField.focus();
                    } else {
                        clearInterval(clockTicker);
                        handleFailureState("❌ Out of tries!");
                    }
                }
            }

            function handleFailureState(reasonMessage) {
                // Streak resets entirely back to zero on a mistake
                runningStreak = 0;
                document.getElementById('display-streak').innerText = runningStreak;

                alertDisplay.className = "alert-box state-incorrect";
                alertDisplay.innerHTML = reasonMessage + " Let's learn: " + factorA + " × " + factorB + " = " + targetProduct;

                setTimeout(startNewRound, 4000);
            }

            commitButton.addEventListener('click', processUserValidation);
            inputField.addEventListener('keyup', function(e) {
                if (e.key === "Enter") processUserValidation();
            });

            startNewRound();
        })();
    </script>
</body>
</html>
